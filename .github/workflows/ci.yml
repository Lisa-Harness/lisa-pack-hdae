name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gates (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - name: Check out the pack
        uses: actions/checkout@v4

      # actions/checkout requires the path to stay under the workspace,
      # so the framework lands in ./lisa next to the pack's own files.
      - name: Check out framework
        uses: actions/checkout@v4
        with:
          repository: Lisa-Harness/lisa
          path: lisa

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
        working-directory: lisa

      - name: Install framework
        run: uv sync --extra dev
        working-directory: lisa

      # The pack's own runtime dependencies are not part of the framework
      # distribution, so the pack is installed into the framework
      # environment as well.
      - name: Install the pack
        run: uv pip install --python .venv -e ..
        working-directory: lisa

      # ruff and mypy resolve their configuration from the working
      # directory, so they run against the framework checkout: that is
      # where the shared [tool.ruff] and [tool.mypy] settings live. The
      # pack tree is the target, not the config.
      - name: Format check (ruff)
        run: uv run ruff format --check "../lisa_packs/hdae"
        working-directory: lisa

      - name: Lint (ruff)
        run: uv run ruff check "../lisa_packs/hdae"
        working-directory: lisa

      # mypy is run against the pack root so the pack's own namespace
      # package resolves. The exclude drops the build/ tree that a local
      # "pip install -e ." leaves behind: it is gitignored, so it is absent
      # in CI, but when present it duplicates the "lisa_packs" module and
      # makes mypy stop before it checks anything.
      - name: Type check (mypy)
        run: uv run mypy --exclude '(^|/)build/' "../lisa_packs/hdae"
        working-directory: lisa

      # pytest runs from the pack root: the pack's own pyproject.toml sets
      # pythonpath = ["."], which makes lisa_packs.hdae importable so the
      # SDK can infer each operation's module_path from the source tree.
      # The whole-scenario E2E needs the coding and bwrap providers and
      # skips itself here (see the scenario job); the deterministic
      # manifest, catalog, contracts, engine, operation, and eval tests
      # run everywhere.
      - name: Unit tests (no live)
        run: uv run --project lisa pytest -m "not live" --tb=short -v

  # The deterministic end-to-end scenario composes real coding tools,
  # the bwrap sandbox, Git, approvals, and the generated hdae_execute
  # mode. The bwrap pack is a Linux-only sandbox implementation
  # (bubblewrap, overlayfs userxattr, user namespaces), so this job is
  # Linux-only on purpose: a green job on macOS or Windows would only
  # prove that the code imports.
  scenario:
    name: End-to-end scenario (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - name: Check out the pack
        uses: actions/checkout@v4

      - name: Check out framework
        uses: actions/checkout@v4
        with:
          repository: Lisa-Harness/lisa
          path: lisa

      # The scenario drives the real coding and bwrap pack providers, so
      # their public checkouts land next to the pack under the paths the
      # test expects. They are read-only catalog sources for the test.
      - name: Check out coding pack
        uses: actions/checkout@v4
        with:
          repository: Lisa-Harness/lisa-pack-coding
          path: lisa-packs/coding
      - name: Check out bwrap pack
        uses: actions/checkout@v4
        with:
          repository: Lisa-Harness/lisa-pack-bwrap
          path: lisa-packs/bwrap

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
        working-directory: lisa

      - name: Install framework
        run: uv sync --extra dev
        working-directory: lisa

      - name: Install the pack
        run: uv pip install --python .venv -e ..
        working-directory: lisa

      - name: Whole-scenario E2E (deterministic, no live)
        env:
          PYTHONPATH: ${{ github.workspace }}/lisa-packs/coding:${{ github.workspace }}/lisa-packs/bwrap
          HDAE_TEST_CODING_ROOT: ${{ github.workspace }}/lisa-packs/coding/lisa_packs/coding
          HDAE_TEST_BWRAP_ROOT: ${{ github.workspace }}/lisa-packs/bwrap/lisa_packs/bwrap
        # pytest runs from the pack root (the bash/bwrap convention): the
        # pack's pyproject.toml sets pythonpath = ["."] and --project lisa
        # resolves the framework checkout beside it.
        run: uv run --project lisa pytest lisa_packs/hdae/tests/test_scenario_e2e.py lisa_packs/hdae/tests/test_live_scenario.py -m "not live" --tb=short -v