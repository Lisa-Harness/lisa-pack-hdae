[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa-pack-hdae"
version = "0.1.0"
license = "Apache-2.0"
description = "Artifact-driven HDAE engineering with harness-verified gates"
requires-python = ">=3.11"
dependencies = ["lisa-harness-kernel", "lisa-harness-sdk", "pydantic>=2", "PyYAML>=6"]

[project.entry-points."lisa.extensions.content_roots"]
hdae = "lisa_packs.hdae:get_content_root"

[project.optional-dependencies]
dev = [
	"pytest>=8", "pytest-asyncio>=0.23", "build>=1", "openai",
	"python-dotenv", "httpx2", "lisa-harness-runtime",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_packs", "lisa_packs.hdae*"]

[tool.setuptools.package-data]
"lisa_packs.hdae" = ["modes/**/*.md", "operations/**/*.yml", "content/**/*", "tools/**/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["lisa_packs/hdae/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires a configured Lisa host or QEMU project"]